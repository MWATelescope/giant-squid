[package]
name = "mwa_giant_squid"
version = "3.0.0"
authors = [
    "Greg Sleap <greg.sleap@curtin.edu.au>",
    "Dev Null <dev.null@curtin.edu.au>",
    "Christopher H. Jordan <christopherjordan87@gmail.com>",
    "Harrison Barlow <harrison.barlow@curtin.edu.au>",    
]
edition = "2021"
rust-version = "1.88.0"
license = "MPL-2.0"
readme = "README.md"
description = "MWA ASVO command line client"
repository = "https://github.com/MWATelescope/giant-squid"
homepage = "https://github.com/MWATelescope/giant-squid"
# Files that only the Python package (mwa-giant-squid, built by maturin) uses. The Rust sources of the
# `python` and `python-stubgen` features (src/python, src/bin/stub_gen.rs) stay: the manifest needs them.
exclude = [
    ".github/*",
    "mwa_giant_squid_cli/*",
    "tests/python/*",
    "docs/PYTHON.md",
    "docs/PYTHON_BINDINGS.md",
    "mwa_giant_squid.pyi",
    "pyproject.toml",
    "tools/generate_stubs.sh",
    "tools/run_stubtest.sh",
    "tools/stubtest_allowlist.txt",
    "uv.lock",
]

# When selecting dependency versions, it prefers versions whose own rust-version (MSRV) is compatible with yours, rather than always picking the newest release.
# It still respects semver constraints as the primary filter — MSRV compatibility is the tiebreaker among eligible versions.
resolver = "3"

[features]
default = ["bin"]
bin = ["anyhow", "clap", "simplelog", "reqwest-retry", "task-local-extensions", "indicatif", "indicatif-log-bridge", "prettytable-rs"]
# Regenerates src/asvo/apiv2/openapi.rs from src/asvo/apiv2/openapi-schema.json
# via build.rs (see the `regen_openapi` module there). Off by default so a
# normal build doesn't need typify and friends; enable when the schema has
# changed and you're ready to regenerate + review + commit the result:
#   cargo build --features regen-openapi
#   git diff src/asvo/apiv2/openapi.rs
regen-openapi = ["dep:typify", "dep:schemars", "dep:syn", "dep:prettyplease"]
# The Python module (`import mwa_giant_squid`). Built by maturin, which reads
# its settings from pyproject.toml: `maturin develop` or `maturin build`.
#
# It includes the "bin" feature, because the module runs the `giant-squid`
# command (`mwa_giant_squid._run_cli`), which the Python `giant-squid` program
# calls. So the wheel carries clap, indicatif and the other CLI crates.
python = ["pyo3", "pyo3-log", "bin"]
# Generates the Python type stubs (`mwa_giant_squid.pyi`) with pyo3-stub-gen.
# Only for maintainers, when the Python API changes: run
# tools/generate_stubs.sh, or build with this feature and run the binary:
#   cargo build --no-default-features --features python-stubgen
#   target/debug/stub_gen
# `stub_gen` embeds Python, so it is linked to a libpython. build.rs gives
# it an rpath to the library directory of the Python that pyo3 builds for
# (`PYO3_PYTHON`, or the first `python3` on the PATH), so it runs without
# `LD_LIBRARY_PATH` even when that Python is a uv-managed one (those keep
# libpython in a directory that the dynamic loader does not search).
# The rpath is an absolute path on the build machine: do not ship the binary.
# Do not use `pyo3/extension-module` here: it removes libpython from the
# link, and `stub_gen` then fails with undefined `Py*` symbols.
# The published crate and the wheel do not use it. pyo3-stub-gen depends on
# chrono, so a build with this feature has chrono in it; other builds do not.
python-stubgen = ["python", "dep:pyo3-stub-gen", "dep:pyo3-build-config"]

[[bin]]
name = "giant-squid"
required-features = ["bin"]

[[bin]]
name = "stub_gen"
doc = false
required-features = ["python-stubgen"]

[profile.release]
lto = "thin"
opt-level = 'z'  # Optimize for size.
panic = 'abort'

# The profile maturin uses for the Python module (see pyproject.toml). A
# Python extension must unwind: pyo3 turns a Rust panic into a Python
# `PanicException`, but with `panic = 'abort'` a panic stops the whole
# Python process.
[profile.release-python]
inherits = "release"
panic = "unwind"

[dependencies]
backoff = "0.4"
base64 = "0.23"
bytes = "1.10"
bytesize = "2.0"
# Dates and times. Only `Timestamp` is used (every MWA ASVO time is UTC), so
# the time zone database features are off. jiff types are in the public API
# (for example `AsvoJob::created`), so a jiff major version is a giant-squid
# major version; `mwa_giant_squid::jiff` re-exports the version in use.
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }
log = "0.4"
litemap = "0.8"
rayon = "1.10"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "charset", "form", "http2", "json", "rustls"] }
reqwest_cookie_store = { version = "0.10", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
tar = "0.4"
thiserror = "2.0"
zerofrom = "0.1"

# Dependencies only for the binary.
anyhow = { version = "1.0", optional = true }
# "string": lets the value parsers of the schema enums (src/cli/value_enums.rs) list their values in --help.
clap = { version = "4.5", features = ["derive", "env", "string"], optional = true }
indicatif = { version = "0.18", optional = true}
indicatif-log-bridge = {version = "0.2", optional = true}
prettytable-rs = { version = "0.10", optional = true }
reqwest-retry = { version = "0.9", optional = true }
simplelog = { version = "0.12", optional = true }
task-local-extensions = { version = "0.1", optional = true }
time = { version = "0.3", optional = true }
time-core = { version = "0.1", optional = true }

# Dependencies only for the Python module ("python" feature).
pyo3 = { version = "0.29", features = ["abi3-py310", "jiff-02"], optional = true }
pyo3-log = { version = "0.13", optional = true }
# Dependencies only for the Python stub generator ("python-stubgen" feature).
# `jiff-02` maps `jiff::Timestamp` to `datetime.datetime`. The default
# features are off because they add `numpy`, which this crate does not use;
# `infer_signature` writes the default values of arguments (for example
# `keep_tar=False`) in the stubs.
pyo3-stub-gen = { version = "0.23.1", default-features = false, features = ["infer_signature", "jiff-02"], optional = true }

[dev-dependencies]
tempfile = "3.20"
rand = "0.10"
# Runs a real local HTTP server per test, so the client's requests and
# response handling are exercised end to end without touching a real MWA
# ASVO. The "record" feature is only needed by tests/record.rs, which is
# #[ignore]d and captures fixtures from a live server by hand.
httpmock = { version = "0.8", features = ["record"] }

[build-dependencies]
built = "0.8"
serde_json = "1.0"
# Only for the `python-stubgen` feature: finds the libpython directory for
# the rpath of the `stub_gen` binary. The same version as pyo3.
pyo3-build-config = { version = "0.29", features = ["resolve-config"], optional = true }
# Only needed to regenerate src/asvo/apiv2/openapi.rs - see the
# regen-openapi feature above.
prettyplease = { version = "0.3", optional = true }
schemars = { version = "0.8", optional = true }
syn = { version = "3.0", optional = true }
typify = { version = "0.8", optional = true }

#[lints.clippy]
#unwrap_used      = "warn"
#expect_used      = "warn"
#panic            = "warn"
#indexing_slicing = "warn"
#arithmetic_side_effects = "warn"