---
name: Cross-platform tests
permissions:
  contents: read

# Do this on every push, except tags

on:
  push:
    tags-ignore:
      - "**"
    branches:
      - "**"
  pull_request:

env:
  CARGO_TERM_COLOR: always
  MWA_ASVO_API_KEY: ${{ secrets.MWA_ASVO_API_KEY }}

jobs:
  test:
    name: Test ${{ matrix.os }} toolchain ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macOS-15-intel, macOS-15]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: "msrv"
    steps:
    - name: Checkout sources
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Get MSRV
      if: matrix.toolchain == 'msrv'
      run:
        echo "MSRV=$(grep -m1 'rust-version' Cargo.toml | sed 's|.*\"\(.*\)\"|\1|')" >> "$GITHUB_ENV"

    - name: Install Rust minimal toolchain ${{ matrix.toolchain }}
      uses: dtolnay/rust-toolchain@v1
      with:          
        toolchain: ${{ matrix.toolchain == 'msrv' && env.MSRV || matrix.toolchain }}        
    
    - name: Run tests
      run: cargo test --locked

  openapi-drift-check:
    name: Check openapi.rs matches openapi-schema.json
    runs-on: ubuntu-latest
    steps:
    - name: Checkout sources
      uses: actions/checkout@v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: stable

    - name: Regenerate src/asvo/apiv2/openapi.rs
      run: cargo build --features regen-openapi

    - name: Fail if regeneration produced a diff
      run: |
        if ! git diff --exit-code -- src/asvo/apiv2/openapi.rs; then
          echo "::error::src/asvo/apiv2/openapi.rs is out of date relative to openapi-schema.json. Run 'cargo build --features regen-openapi' locally and commit the result."
          exit 1
        fi
