---
name: Lint
permissions:
  contents: read

# Rust format, clippy, library-only build and docs. The checks are in check.sh, so that they are the same on a
# developer machine and here. The tests are in run-tests.yaml, and the Python checks are in python.yaml.

on:
  push:
    tags-ignore:
      - "**"
    branches:
      - "**"
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Rust format, clippy and docs
    runs-on: ubuntu-latest
    steps:
    - name: Checkout sources
      uses: actions/checkout@v6

    # The lint job uses the Rust version in `rust-version` of Cargo.toml (the MSRV), not `stable`, so that a new Rust
    # release cannot make clippy find new things without a change in the code. To move to a newer Rust, raise
    # `rust-version` and fix what its clippy finds in the same commit.
    - name: Get MSRV
      run: echo "MSRV=$(grep -m1 'rust-version' Cargo.toml | sed 's|.*\"\(.*\)\"|\1|')" >> "$GITHUB_ENV"

    - name: Install Rust at the MSRV, with rustfmt and clippy
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: ${{ env.MSRV }}
        components: rustfmt, clippy

    # The Python module is only type-checked here (clippy), not linked, so the Python of the runner is enough.
    - name: Run check.sh
      run: ./check.sh
