---
name: Release
permissions:
  contents: read

# Do this on every push
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  # Stop before anything is built if the tag is not the version in Cargo.toml (the Python package takes its version
  # from Cargo.toml too). `cargo build --locked` in the later jobs fails if Cargo.lock has another version.
  check-version:
    name: Check that the tag is the version of the crate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout sources
      uses: actions/checkout@v6

    - name: Compare the tag with Cargo.toml
      env:
        TAG: ${{ github.ref_name }}
      run: |
        cargo_version="$(grep -m1 '^version' Cargo.toml | sed 's|.*"\(.*\)"|\1|')"
        if [[ "${TAG}" != "v${cargo_version}" ]]; then
          echo "::error::The tag ${TAG} is not the version in Cargo.toml (v${cargo_version})."
          exit 1
        fi

  # The tests of the commit that is released, run again here: a release cannot be taken back from crates.io.
  test:
    name: Run the tests
    runs-on: ubuntu-latest
    needs: [check-version]

    steps:
    - name: Checkout sources
      uses: actions/checkout@v6

    - name: Install Rust, stable minimal toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: stable

    - name: Run tests
      run: cargo test --locked

  build-linux-x86_64-release:
    name: Build release for Linux x86_64
    runs-on: ubuntu-latest
    needs: [check-version]

    steps:
    - name: Checkout sources
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install Rust, stable minimal toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: stable

    - name: Build
      run: .github/workflows/build.sh

    - name: Upload tarball
      uses: actions/upload-artifact@v7
      with:
        name: linux_x86_64.tar.gz
        path: "*.tar.gz"
        if-no-files-found: error

  build-macos-x86_64-release:
    name: Build release for MacOS x86_64
    runs-on: macos-15-intel
    needs: [check-version]

    steps:
    - name: Checkout sources
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install Rust, stable minimal toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: stable

    - name: Build
      run: .github/workflows/build.sh

    - name: Upload tarball
      uses: actions/upload-artifact@v7
      with:
        name: macos15-intel.tar.gz
        path: "*.tar.gz"
        if-no-files-found: error

  build-macos-arm64-release:
    name: Build release for MacOS arm64
    runs-on: macos-15
    needs: [check-version]

    steps:
    - name: Checkout sources
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install Rust, stable minimal toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: stable

    - name: Build
      run: .github/workflows/build.sh

    - name: Upload tarball
      uses: actions/upload-artifact@v7
      with:
        name: macos15-arm64.tar.gz
        path: "*.tar.gz"
        if-no-files-found: error

  # The Python wheels (mwa-giant-squid), built as in python.yaml. They are attached to the GitHub release.
  # Publishing to PyPI is not done here.
  build-python-wheels:
    name: Build Python wheel for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [check-version]
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macOS-15-intel, macOS-15]

    steps:
    - name: Checkout sources
      uses: actions/checkout@v6

    # On Linux this runs in a manylinux container, so the wheel installs on older systems (many HPC systems).
    - name: Build the wheel
      uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
      with:
        command: build
        args: --release --locked --out dist
        manylinux: auto

    - name: Upload the wheel
      uses: actions/upload-artifact@v7
      with:
        name: wheel-${{ matrix.os }}
        path: dist/*.whl
        if-no-files-found: error

  create-release:
    name: Create a new release
    runs-on: ubuntu-latest
    needs: [test, build-linux-x86_64-release, build-macos-x86_64-release, build-macos-arm64-release, build-python-wheels]
    permissions:
      contents: write
    steps:      
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:          
          merge-multiple: true

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$tag" \
              --repo="$GITHUB_REPOSITORY" \
              --title="${GITHUB_REPOSITORY#*/} ${tag#v}" \
              --generate-notes *.tar.gz *.whl

  create-rust-release:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [create-release]    
    steps:
        - name: Checkout sources
          uses: actions/checkout@v6

        - name: Install Rust, stable minimal toolchain
          uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
          with:
            toolchain: stable

        # `cargo publish` builds the crate before it uploads it. The tests ran in the `test` job, which
        # `create-release` waits for.
        - uses: katyo/publish-crates@02cc2f1ad653fb25c7d1ff9eb590a8a50d06186b # v2
          with:
              registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
              args: --locked
