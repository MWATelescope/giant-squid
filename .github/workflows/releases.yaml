---
name: Release
permissions:
  contents: read

# Do this on every push
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-x86_64-release:
    name: Build release for Linux x86_64
    runs-on: ubuntu-latest

    steps:
    - name: Checkout sources
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install Rust, stable minimal toolchain
      uses: dtolnay/rust-toolchain@stable      

    - name: Build
      run: .github/workflows/build.sh

    - name: Upload tarball
      uses: actions/upload-artifact@v7
      with:
        name: linux_x86_64.tar.gz
        path: "*.tar.gz"
        if-no-files-found: error

  # build-linux-arm64-release:
  #   name: Build release for Linux arm64
  #   runs-on: ubuntu-22.04-arm

  #   steps:
  #   - name: Checkout sources
  #     uses: actions/checkout@v6
  #     with:
  #       fetch-depth: 0

  #   - name: Install Rust, stable minimal toolchain
  #     uses: dtolnay/rust-toolchain@v1
  #     with:          
  #       toolchain: stable

  #   - name: Build
  #     run: .github/workflows/build.sh

  #   - name: Upload tarball
  #     uses: actions/upload-artifact@v4
  #     with:
  #       name: linux_arm64.tar.gz
  #       path: "*.tar.gz"
  #       if-no-files-found: error        

  build-macos-x86_64-release:
    name: Build release for MacOS x86_64
    runs-on: macos-15-intel

    steps:
    - name: Checkout sources
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install Rust, stable minimal toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Build
      run: .github/workflows/build.sh

    - name: Upload tarball
      uses: actions/upload-artifact@v7
      with:
        name: macos15-intel.tar.gz
        path: "*.tar.gz"
        if-no-files-found: error

  build-macos-arm64-release:
    name: Build release for MacOS arm64
    runs-on: macos-15

    steps:
    - name: Checkout sources
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install Rust, stable minimal toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Build
      run: .github/workflows/build.sh

    - name: Upload tarball
      uses: actions/upload-artifact@v7
      with:
        name: macos15-arm64.tar.gz
        path: "*.tar.gz"
        if-no-files-found: error

  # The Python wheels (mwa-giant-squid), built as in python.yaml. They are attached to the GitHub release.
  # Publishing to PyPI is not done here.
  build-python-wheels:
    name: Build Python wheel for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macOS-15-intel, macOS-15]

    steps:
    - name: Checkout sources
      uses: actions/checkout@v6

    # On Linux this runs in a manylinux container, so the wheel installs on older systems (many HPC systems).
    - name: Build the wheel
      uses: PyO3/maturin-action@v1
      with:
        command: build
        args: --release --out dist
        manylinux: auto

    - name: Upload the wheel
      uses: actions/upload-artifact@v7
      with:
        name: wheel-${{ matrix.os }}
        path: dist/*.whl
        if-no-files-found: error

  create-release:
    name: Create a new release
    runs-on: ubuntu-latest
    needs: [build-linux-x86_64-release, build-macos-x86_64-release, build-macos-arm64-release, build-python-wheels]
    permissions:
      contents: write
    steps:      
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:          
          merge-multiple: true

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$tag" \
              --repo="$GITHUB_REPOSITORY" \
              --title="${GITHUB_REPOSITORY#*/} ${tag#v}" \
              --generate-notes *.tar.gz *.whl

  create-rust-release:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [create-release]    
    steps:
        - name: Checkout sources
          uses: actions/checkout@v6

        - name: Install stable, minimal toolchain
          uses: dtolnay/rust-toolchain@stable     

        - name: Run tests on latest stable rust
          run: cargo build --release

        - uses: katyo/publish-crates@v2
          with:
              registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
              args: --no-verify