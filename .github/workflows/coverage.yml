on:
  push:
    tags-ignore:
      - "**"
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

# No MWA ASVO credentials here on purpose - see run-tests.yaml.

name: Generate Coverage report

jobs:
  coverage:
    runs-on: ubuntu-latest    
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust, stable minimal toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: llvm-tools
      
      # A prebuilt binary: `cargo install cargo-llvm-cov` compiled it from source on every run.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-llvm-cov

      - name: Generate test lcov coverage into coverage/ dir
        env:
          # The generated openapi.rs is left out, as in tools/coverage.sh.
          COVERAGE_IGNORE_REGEX: 'src/mwa_asvo/api/openapi\.rs'
        run: |
          mkdir -p coverage
          cargo llvm-cov clean --workspace
          cargo llvm-cov --locked --all --lcov --output-path coverage/coverage.lcov --ignore-filename-regex "${COVERAGE_IGNORE_REGEX}"
          # this uses the result of the previous run to generate a text summary
          cargo llvm-cov report --ignore-filename-regex "${COVERAGE_IGNORE_REGEX}"

      - name: Upload reports to codecov.io
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
